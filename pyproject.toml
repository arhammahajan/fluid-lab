[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fluid-lab"
version = "2.0.0"
description = "Fluid-mechanics laboratory calculators: centrifugal pump, Francis turbine, orifice and mouthpiece."
readme = "README.md"
requires-python = ">=3.12"
license = { file = "LICENSE" }
keywords = ["fluid-mechanics", "hydraulics", "pump", "turbine", "orifice", "laboratory", "uncertainty"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Physics",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "mypy>=1.11",
    "pytest>=8.0",
    "ruff>=0.6",
]

[project.scripts]
fluid-lab = "fluid_lab.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["fluid_lab"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers --strict-config --doctest-modules"
testpaths = ["fluid_lab", "tests"]
pythonpath = ["."]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
pretty = true
files = ["fluid_lab", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["fluid_lab", "tests"]

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ANN",  # flake8-annotations
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "PTH",  # flake8-use-pathlib
    "RET",  # flake8-return
    "RUF",  # ruff-specific
    "SIM",  # flake8-simplify
    "UP",   # pyupgrade
    "W",    # pycodestyle warnings
]
ignore = [
    "ANN401", # dynamically typed function arguments (the CLI registry)
    "D203",   # one-blank-line-before-class (conflicts with D211)
    "D213",   # multi-line-summary-second-line (conflicts with D212)
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ANN201", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"
